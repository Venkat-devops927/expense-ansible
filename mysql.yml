- name: mqsql configuration
  hosts: mysql
  become: yes
  vars:
  - mysql_root_password: ExpenseApp@1
  - login_host: mysql.aryan927.shop
  tasks:
  - name: install mysql server
    ansible.builtin.package:
      name: mysql-server
      state: present
  - name: start the mysql server
    ansible.builtin.service:
      name: mysqld
      state: started
      enabled: yes
  - name: connect to my sql server
    community.mysql.mysql_info:
      login_user: root
      login_password: "{{ mysql_root_password }}"
      login_host: "{{ login_host }}"
    register: mysql_info
  - name: print mysql mysql_info
    ansible.builtin.debug:
      msg: "{{ mysql_info }}"